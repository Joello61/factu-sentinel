name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # dbname_suffix (config/packages/doctrine.yaml, when@test) turns this into
      # "factusentinel_test" for the actual connection used by the test suite.
      DATABASE_URL: "postgresql://app:app@localhost:5432/factusentinel?serverVersion=18&charset=utf8"
      APP_ENV: test
      # Phase 17 (docs/12-roadmap.md) - App\Document\Service\ClamAvScanner. Service
      # container reachable at localhost on the runner (same network as the job).
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3310"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: factusentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d factusentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # "clamav/clamav" (pas la variante "_base") embarque déjà son propre HEALTHCHECK
      # (ping/pong clamd, vérifié sur la documentation officielle le 26/08/2026) - GitHub
      # Actions attend qu'un service devienne "healthy" avant de démarrer les steps dès
      # qu'un healthcheck existe, image ou "options" explicite, donc aucun "options:"
      # supplémentaire n'est nécessaire ici.
      clamav:
        image: clamav/clamav:1.5.2
        ports:
          - 3310:3310
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # docs/10-security-privacy.md, section 48 - Phase 10 : aucun scan de dépendances
      # n'existait avant cette phase. Bloquant par défaut (composer audit échoue dès qu'une
      # avisory est trouvée) - aucun seuil de sévérité personnalisé, comportement natif de
      # la commande (vérifié sur Composer 2.10, section 3 de ../../CLAUDE.md).
      - name: Audit dependencies (composer audit)
        run: composer audit

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      # Second trousseau, structurellement séparé (Phase 15, ADR-009,
      # backend/config/services.yaml platform_admin_jwt.*) - trou découvert lors de la revue
      # de sécurité de fin de phase : cette paire n'était générée nulle part sur un checkout
      # CI neuf, faisant échouer silencieusement toute émission de jeton PlatformAdministrator.
      - name: Generate platform admin JWT keypair
        run: php bin/console app:platform-admin:jwt:generate-keypair --skip-if-exists

      - name: Lint PHP syntax
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 -P "$(nproc)" php -l

      # docs/10-security-privacy.md, section 49 - Phase 10 : analyse de qualité/sûreté de
      # typage (backend/phpstan.neon, niveau 6). Distinct d'un SAST sécurité : PHP n'est pas
      # un langage supporté par CodeQL (vérifié en implémentation, écosystème actuel) - voir
      # le job "codeql" ci-dessous, limité au frontend JS/TS pour cette raison. Aucun SAST
      # sécurité dédié n'existe donc pour ce backend PHP à ce stade (dette technique connue,
      # documentée docs/10-security-privacy.md section 68).
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        run: php bin/phpunit

  frontend-lint:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # docs/10-security-privacy.md, section 48 - Phase 10. --audit-level=high : ignore le
      # bruit de sévérité faible/moyenne non actionnable, cohérent avec la release gate
      # "vulnérabilité critique" de la section 62 - toute avisory high/critical bloque.
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      # Phase 17 (docs/12-roadmap.md) - Release Gate ajouté après avoir constaté qu'un
      # build de production cassé (erreur TypeScript pré-existante dans
      # app/(app)/company/CompanyForm.test.tsx, masquant un bug amont Next.js déjà
      # documenté) restait invisible en CI tant que "next build" n'y était jamais exécuté :
      # lint et tests passaient sans qu'aucune image de production ne soit jamais
      # constructible. Bloquant, sans exception, avant tout travail de déploiement.
      - name: Build (next build)
        run: npm run build

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # docs/10-security-privacy.md, section 49 - Phase 10 : aucun scan de secrets n'existait
      # avant cette phase. fetch-depth: 0 requis par gitleaks pour parcourir l'historique
      # complet (documentation officielle gitleaks-action vérifiée le 20/08/2026), donc
      # isolé dans son propre job plutôt que d'alourdir le clone des jobs de lint/test.
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v3 (v2 déprécié, incompatible avec le runtime Node 24 des runners GitHub à partir du
      # 16/09/2026, vérifié le 20/08/2026). Aucune licence requise pour un dépôt appartenant
      # à un compte personnel (vérifié dans la documentation officielle) - à revoir si ce
      # dépôt devait un jour appartenir à une organisation GitHub.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      # docs/12-roadmap.md, Phase 11 (MVP Validation) : E2E-001 à E2E-005
      # (docs/09-test-strategy.md, section 38) - E2E-006 déjà couvert au niveau backend en
      # Phase 9 (RuleVersionNonRetroactivityTest), voir la précision de la section 25 de la
      # roadmap. Pile complète démarrée via docker-compose.yml (jamais réimplémentée en
      # services GitHub Actions séparés : nginx/backend/frontend/postgres/redis/mustang sont
      # déjà câblés entre eux dans ce fichier) + docker-compose.e2e.yml (Mailpit, test-only -
      # jamais utilisé par les jobs backend-lint/frontend-lint ci-dessus).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installé sur le runner AVANT de construire/démarrer la pile Docker : le service
      # "frontend" monte ./frontend:/app en bind mount (docker-compose.yml) - sur les runners
      # GitHub-hosted, ce chemin hôte est le même répertoire de travail que celui utilisé ici.
      # Un conteneur qui écrirait dans /app avant que "npm ci" ne s'exécute sur l'hôte a déjà
      # laissé des fichiers appartenant à root sous frontend/node_modules, faisant échouer
      # "npm ci" avec EACCES (constaté sur ce job) - installer ici en premier, sur un
      # répertoire de travail vierge, élimine la course.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Build stack images
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml build

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d

      # backend/frontend n'ont pas de HEALTHCHECK Docker natif (docker-compose.yml) : cette
      # boucle applicative attend que Nginx -> Symfony -> PostgreSQL réponde réellement,
      # plutôt que de supposer un délai fixe suffisant.
      - name: Wait for the stack to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Backend ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend did not become ready in time." >&2
              docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
              exit 1
            fi
            sleep 5
          done

      - name: Run database migrations
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run Playwright E2E suite
        working-directory: frontend/e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          MAILPIT_BASE_URL: http://localhost:8025
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # docs/10-security-privacy.md, section 49 - Phase 10. Frontend uniquement : PHP n'est
      # pas un langage supporté par CodeQL (vérifié le 20/08/2026, ../../CLAUDE.md section 3)
      # - voir le commentaire du job "backend-lint" pour la conséquence sur le backend.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
