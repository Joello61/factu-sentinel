# Reverse proxy local - route /api/ vers le backend Symfony (PHP-FPM),
# tout le reste vers le frontend Next.js. Cohérent avec docs/06-technical-architecture.md
# (section 4, 30) et le préfixe /api/v1 de docs/08-api-specification.md (section 5).

client_max_body_size 20m;

# IP/schéma client réels (Phase 12, Private Beta via Cloudflare Quick Tunnel,
# docs/14-private-beta-plan.md). Vérifié sur la documentation officielle Cloudflare : à travers
# un Cloudflare Tunnel, l'IP réelle du visiteur arrive dans l'en-tête CF-Connecting-IP - posé
# par l'edge Cloudflare lui-même à partir de la connexion TCP réelle, jamais par le client -
# jamais dans X-Forwarded-For (accumulable, explicitement déconseillé par Cloudflare pour cet
# usage). $proxy_add_x_forwarded_for a été essayé et rejeté : en local, le pair direct de nginx
# (hôte Docker) est lui-même une adresse privée, donc dans le même sous-réseau que celui
# confié à Symfony (trusted_proxies: PRIVATE_SUBNETS) - un client peut alors faire remonter un
# X-Forwarded-For arbitraire à travers plusieurs sauts privés sans jamais être arrêté (vérifié
# empiriquement : 6 tentatives de connexion avec une IP différente forgée à chaque fois n'ont
# jamais déclenché le rate limiting attendu après 5 essais). Ces `map` ECRASENT la valeur
# transmise à Symfony plutôt que de l'accumuler - nginx est la seule autorité sur ce qu'il
# envoie en aval, jamais un relais aveugle d'un en-tête fourni par le client.
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

map $http_cf_connecting_ip $real_client_proto {
    # Présence de CF-Connecting-IP = requête arrivée via le tunnel Cloudflare, donc
    # nécessairement https côté visiteur (aucun accès http:// possible à un sous-domaine
    # trycloudflare.com) - $scheme seul refléterait ici le protocole interne nginx<->cloudflared
    # (toujours http), pas celui vu par le visiteur réel.
    default 'https';
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Backend Symfony (API REST) - point d'entrée unique (front controller).
    location /api/ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;

        # IP/schéma client réels transmis à Symfony (framework.yaml: trusted_proxies) - voir les
        # `map` en tête de fichier. Valeur unique et écrasée, jamais une liste accumulée.
        fastcgi_param HTTP_X_FORWARDED_FOR $real_client_ip;
        fastcgi_param HTTP_X_FORWARDED_PROTO $real_client_proto;
    }

    # Frontend Next.js (App Router, dev server ou serveur "standalone" en production).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $real_client_proto;

        # Nécessaire au Hot Module Replacement de "next dev" en local.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
