# Prometheus - étape 2 de la Phase 18 (docs/19-observability-architecture.md). Jamais de
# port hôte publié (docker-compose.prod.yml) - accessible uniquement depuis Grafana (étape
# 3) sur le réseau Docker interne.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Rétention explicite (docs/10-security-privacy.md, discipline de rétention bornée) - passée
# en argument de démarrage du conteneur (docker-compose.prod.yml,
# "--storage.tsdb.retention.time=15d"), jamais illimitée sur un VPS partagé avec les données
# métier.

scrape_configs:
  # GET /api/metrics (App\Shared\Controller\GetMetricsController), servi par Nginx qui, lui,
  # est déjà exposé publiquement via Traefik pour le reste de l'API - le jeton est donc la
  # seule protection réelle de cette route. Jamais le jeton en clair ici (fichier versionné,
  # ../../CLAUDE.md section 15) : lu depuis un fichier séparé, jamais committé
  # (docker/observability/README.md détaille la procédure exacte).
  - job_name: factusentinel-backend
    scheme: http
    static_configs:
      - targets: ['nginx:80']
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_scrape_token

# Métriques hôte (CPU/RAM/disque, prometheus.exporter.unix) : Alloy ne les expose jamais
# sur un /metrics que Prometheus pourrait "pull" (vérifié - le composant exporter à lui seul
# ne sert aucun endpoint HTTP agrégé) - il faut le "push" explicitement via
# prometheus.remote_write (docker/observability/alloy-config.alloy) vers le récepteur
# remote-write de Prometheus, activé ci-dessous (docker-compose.prod.yml,
# "--web.enable-remote-write-receiver").
