# Tempo - étape 4 de la Phase 18 (docs/19-observability-architecture.md). Mode
# monolithique (target "all", le défaut) - vérifié avant de choisir Tempo : ce mode ne
# nécessite jamais Kafka, contrairement au mode microservices/scale introduit en Tempo 3.0.
# Jamais de port hôte publié (docker-compose.prod.yml) - seuls Grafana (lecture) et le
# backend (écriture OTLP) parlent à ce service, sur le réseau Docker interne.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: '0.0.0.0:4317'
        http:
          endpoint: '0.0.0.0:4318'

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Rétention courte et explicite (docs/10-security-privacy.md, discipline de rétention
# bornée) - les traces sont le signal le plus volumineux et le moins utile à long terme des
# trois (logs/métriques/traces), contrairement à la rétention par défaut de Tempo (14 jours).
# Tempo 3.0 a supprimé la section "compactor" (compaction gérée en interne en mode
# monolithique) - la rétention est désormais une limite "overrides", jamais plus une
# config dédiée (constaté à la vérification : "field compactor not found in type
# app.Config" avec l'ancienne syntaxe).
overrides:
  defaults:
    compaction:
      block_retention: 168h

# Jamais de télémétrie anonyme envoyée à Grafana Labs (docs/10-security-privacy.md, Secure
# Defaults - aucune donnée transmise à un tiers sans décision explicite), même principe que
# Loki (docker/observability/loki-config.yaml).
usage_report:
  reporting_enabled: false
