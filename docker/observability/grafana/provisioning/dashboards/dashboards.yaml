# Fournisseur de dashboards par fichier - les JSON commités dans
# docker/observability/grafana/dashboards/ sont chargés automatiquement, jamais construits
# à la main dans l'UI. "allowUiUpdates: false" : toute modification doit passer par le
# fichier JSON commité, jamais par un clic UI qui serait perdu au prochain déploiement.
apiVersion: 1

providers:
  - name: factusentinel
    orgId: 1
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
