# Règles d'alerte - étape 3 de la Phase 18. Reprend la grille de sévérité déjà écrite
# (docs/10-security-privacy.md, section 37) dans la mesure de ce qui est réellement
# détectable depuis des métriques génériques : le niveau "Critique" de cette grille
# (violation d'isolation multi-tenant, faille d'authentification exploitée, fuite de
# secret) N'EST PAS couvert ici - ce sont des événements applicatifs qui nécessiteraient
# une instrumentation dédiée, jamais dérivables d'un taux de 4xx/5xx générique. Ne pas
# présenter ces règles comme couvrant ce niveau.
#
# Seuils marqués "à ajuster" : valeurs initiales de démarrage, jamais calibrées sur un
# usage réel (même discipline que les limites du rate limiter, backend/config/packages/
# rate_limiter.yaml) - à revoir une fois un volume réel observé.
#
# Point de contact (Telegram) et politique de notification : configurés une fois,
# manuellement, via l'UI Grafana - jamais dans ce fichier (docker/observability/README.md
# détaille la procédure et la raison, même principe déjà appliqué à Uptime Kuma).
apiVersion: 1

groups:
  - orgId: 1
    name: factusentinel_alerts
    folder: FactuSentinel
    interval: 1m
    rules:
      - uid: factusentinel_http_5xx_burst
        title: "Rafale de 5xx"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: moyen
        annotations:
          summary: "Taux de réponses 5xx anormalement élevé (docs/10-security-privacy.md section 37)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(rate(factusentinel_http_5xx_responses_total[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: mean
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: factusentinel_login_failure_rate_anomaly
        title: "Taux d'échec de connexion anormal"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: eleve
        annotations:
          summary: "Indice de brute force sur POST /api/v1/auth/login (docs/10-security-privacy.md section 36)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(rate(factusentinel_http_4xx_responses_total{action="POST-auth_login_check"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: mean
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                # À ajuster une fois un volume réel de connexions observé.
                - evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: factusentinel_mustang_unreachable
        title: "Mustang injoignable"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: moyen
        annotations:
          summary: "Dépendance externe dégradée : Validator Container Mustang (docs/10-security-privacy.md section 36)."
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: factusentinel_mustang_reachable
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: factusentinel_redis_unreachable
        title: "Redis injoignable"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: moyen
        annotations:
          summary: "Dépendance externe dégradée : Redis (docs/10-security-privacy.md section 36)."
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: factusentinel_redis_reachable
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: factusentinel_ai_cost_anomaly
        title: "Coût IA anormal (24h)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: eleve
        annotations:
          summary: "Volume/coût IA anormal - risque d'abus ou de dérive de coût (docs/10-security-privacy.md section 36, ../CLAUDE.md section 15 relatif à AI Gateway)."
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: factusentinel_ai_estimated_cost_24h_eur
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                # Seuil très conservateur pour un usage solo/beta - à ajuster une fois un
                # volume réel de clients observé.
                - evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
