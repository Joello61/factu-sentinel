# Overlay E2E (Phase 11, docs/12-roadmap.md) - jamais fusionné dans docker-compose.yml,
# jamais utilisé en dehors d'un run Playwright (local ou CI). Usage :
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
#
# Ajoute uniquement ce qui est nécessaire pour que les parcours E2E-001 à E2E-005
# (docs/09-test-strategy.md section 38) soient pilotables sans intervention manuelle :
# un serveur SMTP de test (Mailpit) pour récupérer par API le lien de vérification d'email
# envoyé par App\Identity\Mailer\VerifyEmailMailer - EmailVerificationGuard (Phase 10)
# bloque sinon l'upload de document et le déclenchement d'analyse de conformité, sur
# lesquels reposent E2E-002/003/004. backend/.env garde MAILER_DSN=null://null intact :
# cette surcharge n'existe que pour ce fichier.

services:
  mailpit:
    image: axllent/mailpit:v1.30.7
    expose:
      - '1025'
    ports:
      # Publié en local uniquement : Playwright tourne hors Docker (sur le runner CI ou
      # la machine de dev), il doit atteindre l'API HTTP de Mailpit directement.
      - '127.0.0.1:8025:8025'

  backend:
    environment:
      MAILER_DSN: 'smtp://mailpit:1025'
    depends_on:
      mailpit:
        condition: service_started

  worker:
    environment:
      MAILER_DSN: 'smtp://mailpit:1025'
    depends_on:
      mailpit:
        condition: service_started
