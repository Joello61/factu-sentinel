; Phase 7 - Document Processing (docs/12-roadmap.md). Les valeurs par défaut de l'image PHP
; officielle (upload_max_filesize=2M, post_max_size=8M) sont très en dessous de la limite
; produit de 20 Mo par fichier (08-api-specification.md, section 31 ; 10-security-privacy.md,
; section 22) - constaté à l'implémentation (un upload de 20 Mo échouait silencieusement côté
; PHP avant même d'atteindre App\Document\Service\UploadedDocumentValidator, avec un message
; d'erreur trompeur "fichier vide ou illisible" au lieu d'un 413 propre).
;
; post_max_size > upload_max_filesize : marge pour l'overhead multipart/form-data (champ
; invoice_id, boundaries) - jamais égal, sans quoi un fichier de exactement 20 Mo échouerait
; à cause de cet overhead. La limite applicative réelle de 20 Mo reste appliquée
; explicitement par UploadedDocumentValidator (DOCUMENT_MAX_SIZE_BYTES, jamais seulement
; déléguée à cette configuration php.ini, qui ne fait qu'éviter un échec silencieux en amont).
upload_max_filesize = 21M
post_max_size = 25M
memory_limit = 256M
