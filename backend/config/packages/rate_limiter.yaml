framework:
    rate_limiter:
        # /auth/login est protégé nativement par security.yaml (login_throttling).
        # /auth/password/forgot déclenche un envoi d'email : sans limite, c'est un vecteur
        # d'email bombing évident (ajout justifié, hors du périmètre strictement documenté
        # - voir plan Phase 2).
        password_reset_request:
            policy: sliding_window
            limit: 3
            interval: "15 minutes"
        # POST /compliance-findings/{id}/explanations et POST /assistant/questions
        # (docs/08-api-specification.md, section 22 : "dépendance externe coûteuse") -
        # un seul compteur partagé par organization_id pour les deux endpoints, le budget
        # IA appartenant à l'usage SaaS de l'organisation, pas à un utilisateur individuel
        # (plan Phase 8). Valeur initiale à calibrer, aucun seuil documenté par ailleurs.
        ai_assistant:
            policy: sliding_window
            limit: 30
            interval: "1 hour"
