doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"

        server_version: "18"

        profiling_collect_backtrace: "%kernel.debug%"
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            # Un seul mapping couvrant l'ensemble de src/ : les entités vivent dans le
            # namespace de leur module (App\Identity\Entity, App\Organization\Entity, ...),
            # pas dans un App\Entity plat - cohérent avec les frontières de modules de
            # 06-technical-architecture.md (section 6). Le driver attribute ne retient que
            # les classes portant #[ORM\Entity], la portée large de ce mapping n'affaiblit
            # donc pas ces frontières, elle évite seulement de déclarer une entrée par
            # module à chaque fois qu'il gagne sa première entité.
            App:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src"
                prefix: "App"
                alias: App
        filters:
            # Isolation tenant (ADR-004) : désactivé par défaut, activé pour la requête
            # courante par App\Shared\Security\TenantFilterActivationListener juste après
            # l'authentification JWT - jamais laissé activé globalement ni au contrôleur.
            tenant_filter:
                class: App\Shared\Doctrine\TenantFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
