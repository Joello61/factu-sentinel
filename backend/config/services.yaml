# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $frontendUrl: '%env(FRONTEND_URL)%'
            string $mailerFrom: '%env(MAILER_FROM)%'
            string $storageLocalBasePath: '%env(STORAGE_LOCAL_PATH)%'
            int $documentMaxSizeBytes: '%env(int:DOCUMENT_MAX_SIZE_BYTES)%'
            string $mustangBaseUrl: '%env(MUSTANG_BASE_URL)%'
            bool $hstsEnabled: '%env(bool:HSTS_ENABLED)%'
            string $platformAdminTotpEncryptionKeyHex: '%env(PLATFORM_ADMIN_TOTP_ENCRYPTION_KEY)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Aucun pattern de binding interface->implémentation n'existait avant la Phase 7
    # (autowiring global uniquement) : StorageInterface est la première abstraction de ce
    # type dans ce projet (backend/src/Shared/Storage/, docs/06-technical-architecture.md
    # ADR-005/ADR-007) - alias explicite requis, l'autowiring seul ne résout pas une
    # interface.
    App\Shared\Storage\StorageInterface: '@App\Shared\Storage\LocalFilesystemStorage'
    App\Document\Service\StructuredDocumentValidatorInterface: '@App\Document\Service\MustangValidatorClient'
    App\Document\Service\AntivirusScannerInterface: '@App\Document\Service\ClamAvScanner'
    App\AI\Service\AIProviderInterface: '@App\AI\Service\MistralProvider'
    # Phase 15 - interfaces cross-module exposées à App\PlatformAdmin\Service\
    # PlatformHealthAggregator (backend/CLAUDE.md, section 3 : jamais de lecture directe des
    # tables internes d'un autre module).
    App\Compliance\Engine\Service\ComplianceHealthReaderInterface: '@App\Compliance\Engine\Service\ComplianceHealthReader'
    App\AI\Service\AiUsageReaderInterface: '@App\AI\Service\AiUsageReader'
    # Phase 16 - interface cross-module exposée à App\PlatformAdmin\Service\
    # PlatformAnalyticsAggregator/App\PlatformAdmin\Controller\GetPlatformAnalyticsTrendsController,
    # même raisonnement que les deux entrées Phase 15 ci-dessus.
    App\Compliance\Engine\Service\ComplianceAnalyticsReaderInterface: '@App\Compliance\Engine\Service\ComplianceAnalyticsReader'

    # Constaté à l'implémentation : contrairement à $mustangBaseUrl ci-dessus, ajouter ces
    # trois valeurs à _defaults.bind ne suffisait pas à les faire résoudre pour
    # MistralProvider (compilation du conteneur en échec, "you should configure its value
    # explicitly", alors que la clé de bind correspondait exactement au paramètre par
    # réflexion) - cause non élucidée avec certitude, contournée en arguments explicites
    # directement sur cette définition de service, seule approche vérifiée fonctionner.
    App\AI\Service\MistralProvider:
        arguments:
            $mistralApiKey: '%env(MISTRAL_API_KEY)%'
            $mistralBaseUrl: '%env(MISTRAL_BASE_URL)%'
            $mistralModel: '%env(MISTRAL_MODEL)%'

    # Mêmes arguments explicites que MistralProvider ci-dessus plutôt que _defaults.bind
    # (cause du problème constaté là-bas non élucidée avec certitude - seule l'approche
    # explicite est vérifiée fonctionner de façon fiable dans ce projet).
    App\Document\Service\ClamAvScanner:
        arguments:
            $clamAvHost: '%env(CLAMAV_HOST)%'
            $clamAvPort: '%env(int:CLAMAV_PORT)%'

    # Deuxième trousseau JWT, structurellement séparé de celui du firewall `api`
    # (docs/06-technical-architecture.md, ADR-009 : "jamais le même émetteur de jeton").
    # Vérifié contre le code source réellement installé de lexik/jwt-authentication-bundle
    # 3.2 et gesdinet/jwt-refresh-token-bundle 3.0 avant d'écrire cette configuration (plan
    # Phase 15, revue utilisateur du 21/08/2026) - ce bundle ne permet pas de configurer une
    # deuxième paire de clés via lexik_jwt_authentication.yaml (secret_key/public_key sont
    # globaux à tout le bundle), donc cette deuxième chaîne complète de services est câblée
    # manuellement ici en réutilisant les classes du bundle (`RawKeyLoader`,
    # `LcobucciJWSProvider`, `LcobucciJWTEncoder`, `JWTManager`, `JWTAuthenticator`,
    # `AuthenticationSuccessHandler`), jamais réimplémentées.
    platform_admin_jwt.key_loader:
        class: Lexik\Bundle\JWTAuthenticationBundle\Services\KeyLoader\RawKeyLoader
        arguments:
            - '%env(resolve:PLATFORM_ADMIN_JWT_SECRET_KEY)%'
            - '%env(resolve:PLATFORM_ADMIN_JWT_PUBLIC_KEY)%'
            - '%env(PLATFORM_ADMIN_JWT_PASSPHRASE)%'
            - []

    # Réutilise Lexik\...\GenerateKeyPairCommand (même classe que `lexik:jwt:generate-keypair`,
    # jamais réimplémentée) sous un second nom de commande, câblée sur ce trousseau plutôt que
    # sur le trousseau tenant par défaut du bundle - vérifié contre
    # vendor/lexik/jwt-authentication-bundle/Resources/config/console.php (le bundle enregistre
    # déjà sa propre commande via ce même patron : tag `console.command` avec une clé `command`
    # qui prend le pas sur le nom `#[AsCommand]` de la classe, confirmé dans
    # vendor/symfony/console/DependencyInjection/AddConsoleCommandPass.php). Trou découvert lors
    # de la revue de sécurité de fin de phase : ni backend/docker/entrypoint-dev.sh ni
    # .github/workflows/lint.yml ne généraient ce second trousseau avant ce correctif - seule la
    # paire tenant l'était, laissant `platform_admin_private.pem` absent sur tout environnement
    # neuf (CI, nouveau poste de développement).
    platform_admin_jwt.generate_keypair_command:
        class: Lexik\Bundle\JWTAuthenticationBundle\Command\GenerateKeyPairCommand
        # autoconfigure désactivé : sans ça, Symfony ajoute AUSSI un tag console.command basé
        # sur #[AsCommand(name: 'lexik:jwt:generate-keypair')] porté par la classe elle-même
        # (constaté via debug:container), créant un alias en collision avec la commande déjà
        # enregistrée par le bundle sous ce même nom (lexik_jwt_authentication.generate_keypair_command).
        autoconfigure: false
        arguments:
            - '@filesystem'
            - '%env(resolve:PLATFORM_ADMIN_JWT_SECRET_KEY)%'
            - '%env(resolve:PLATFORM_ADMIN_JWT_PUBLIC_KEY)%'
            - '%env(PLATFORM_ADMIN_JWT_PASSPHRASE)%'
            - 'RS256'
        tags:
            - { name: 'console.command', command: 'app:platform-admin:jwt:generate-keypair' }

    # TTL volontairement plus court que le firewall tenant (bundle par défaut : 3600s) -
    # 900s (15 minutes), cohérent avec le principe de moindre privilège pour le rôle le plus
    # sensible du produit (docs/10-security-privacy.md, section 17 bis).
    platform_admin_jwt.jws_provider:
        class: Lexik\Bundle\JWTAuthenticationBundle\Services\JWSProvider\LcobucciJWSProvider
        arguments:
            - '@platform_admin_jwt.key_loader'
            - 'RS256'
            - 900
            - 0
            - false

    platform_admin_jwt.encoder:
        class: Lexik\Bundle\JWTAuthenticationBundle\Encoder\LcobucciJWTEncoder
        arguments: ['@platform_admin_jwt.jws_provider']

    # Chaîne d'enrichment propre à ce manager, jamais la chaîne globale
    # `lexik_jwt_authentication.payload_enrichment` (réservée aux jetons User) - garantit que
    # le claim typ=platform_admin (App\Shared\Security\PlatformAdminTypeClaimEnrichment) est
    # embarqué sur absolument tout jeton émis par ce manager, y compris à la rotation du
    # refresh token (Gesdinet\JWTRefreshTokenBundle\...\AttachRefreshTokenOnSuccessListener,
    # qui appelle JWTManager::create() sans jamais repasser par un contrôleur applicatif).
    platform_admin_jwt.payload_enrichment:
        class: Lexik\Bundle\JWTAuthenticationBundle\Services\PayloadEnrichment\ChainEnrichment
        public: true
        arguments:
            - ['@App\Shared\Security\PlatformAdminTypeClaimEnrichment']

    platform_admin_jwt.manager:
        class: Lexik\Bundle\JWTAuthenticationBundle\Services\JWTManager
        arguments:
            - '@platform_admin_jwt.encoder'
            - '@event_dispatcher'
            - 'username'
            - '@platform_admin_jwt.payload_enrichment'

    # ChildDefinition de l'authenticateur abstrait du bundle (parent également utilisé par
    # `jwt: ~` sur le firewall `api`) - seuls le manager (arg 0) et le provider (arg 3)
    # diffèrent, le token extractor (Authorization: Bearer, arg 2) et le dispatcher d'événements
    # (arg 1) restent partagés, ce qui est sûr : chaque listener sur ces événements filtre déjà
    # explicitement par type de principal (App\Shared\Security\TenantFilterActivationListener,
    # App\Shared\Security\PlatformAdminAuthenticationListener).
    platform_admin_jwt.authenticator:
        parent: lexik_jwt_authentication.security.jwt_authenticator
        arguments:
            index_0: '@platform_admin_jwt.manager'
            index_3: '@App\PlatformAdmin\Repository\PlatformAdministratorRepository'

    # Réutilisé pour émettre le JWT complet après vérification TOTP
    # (App\PlatformAdmin\Controller\ConfirmPlatformAdminMfaController) et comme
    # `success_handler` du `refresh-jwt` de ce firewall (backend/config/packages/security.yaml)
    # - même patron que `lexik_jwt_authentication.handler.authentication_success`, réutilisé
    # tel quel par App\Identity\Controller\SelectOrganizationController côté tenant.
    platform_admin_jwt.success_handler:
        class: Lexik\Bundle\JWTAuthenticationBundle\Security\Http\Authentication\AuthenticationSuccessHandler
        arguments:
            - '@platform_admin_jwt.manager'
            - '@event_dispatcher'
            - []
            - true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Jamais d'appel HTTP réel vers Mistral en test (backend/CLAUDE.md, section 13) :
        # les contrôleurs App\AI\Controller\* passent par le vrai routage/conteneur HTTP
        # (KernelBrowser), contrairement au test de App\Document\MessageHandler\
        # ExtractDocumentContentHandler qui instancie son handler directement avec un double
        # manuel - un override du conteneur est donc nécessaire ici. framework.test: true
        # (config/packages/framework.yaml) rend ce service accessible depuis les tests via
        # static::getContainer()->get(FakeAIProvider::class) sans "public: true" explicite.
        App\Tests\Support\FakeAIProvider: ~
        App\AI\Service\AIProviderInterface: '@App\Tests\Support\FakeAIProvider'
