# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $frontendUrl: '%env(FRONTEND_URL)%'
            string $mailerFrom: '%env(MAILER_FROM)%'
            string $storageLocalBasePath: '%env(STORAGE_LOCAL_PATH)%'
            int $documentMaxSizeBytes: '%env(int:DOCUMENT_MAX_SIZE_BYTES)%'
            string $mustangBaseUrl: '%env(MUSTANG_BASE_URL)%'
            bool $hstsEnabled: '%env(bool:HSTS_ENABLED)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Aucun pattern de binding interface->implémentation n'existait avant la Phase 7
    # (autowiring global uniquement) : StorageInterface est la première abstraction de ce
    # type dans ce projet (backend/src/Shared/Storage/, docs/06-technical-architecture.md
    # ADR-005/ADR-007) - alias explicite requis, l'autowiring seul ne résout pas une
    # interface.
    App\Shared\Storage\StorageInterface: '@App\Shared\Storage\LocalFilesystemStorage'
    App\Document\Service\StructuredDocumentValidatorInterface: '@App\Document\Service\MustangValidatorClient'
    App\AI\Service\AIProviderInterface: '@App\AI\Service\MistralProvider'

    # Constaté à l'implémentation : contrairement à $mustangBaseUrl ci-dessus, ajouter ces
    # trois valeurs à _defaults.bind ne suffisait pas à les faire résoudre pour
    # MistralProvider (compilation du conteneur en échec, "you should configure its value
    # explicitly", alors que la clé de bind correspondait exactement au paramètre par
    # réflexion) - cause non élucidée avec certitude, contournée en arguments explicites
    # directement sur cette définition de service, seule approche vérifiée fonctionner.
    App\AI\Service\MistralProvider:
        arguments:
            $mistralApiKey: '%env(MISTRAL_API_KEY)%'
            $mistralBaseUrl: '%env(MISTRAL_BASE_URL)%'
            $mistralModel: '%env(MISTRAL_MODEL)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Jamais d'appel HTTP réel vers Mistral en test (backend/CLAUDE.md, section 13) :
        # les contrôleurs App\AI\Controller\* passent par le vrai routage/conteneur HTTP
        # (KernelBrowser), contrairement au test de App\Document\MessageHandler\
        # ExtractDocumentContentHandler qui instancie son handler directement avec un double
        # manuel - un override du conteneur est donc nécessaire ici. framework.test: true
        # (config/packages/framework.yaml) rend ce service accessible depuis les tests via
        # static::getContainer()->get(FakeAIProvider::class) sans "public: true" explicite.
        App\Tests\Support\FakeAIProvider: ~
        App\AI\Service\AIProviderInterface: '@App\Tests\Support\FakeAIProvider'
