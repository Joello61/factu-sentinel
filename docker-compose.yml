# Environnement de développement local pour FactuSentinel.
# Cohérent avec docs/06-technical-architecture.md (section 30-32, ADR-007) et le
# Definition of Done de la Phase 0 (docs/12-roadmap.md) : `docker compose up` doit
# suffire à démarrer l'application localement.
#
# Les identifiants ci-dessous sont des valeurs de développement local uniquement,
# jamais utilisées en production (docs/10-security-privacy.md, section 27 : aucun
# secret réel ne doit être commité).

services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      # APP_ENV volontairement absent ici : backend/.env commite déjà APP_ENV=dev par
      # défaut (comportement standard Symfony), donc cette variable serait redondante pour
      # l'usage normal du conteneur. La définir ici en ferait en revanche une variable
      # d'environnement réelle du processus (visible via getenv()), qui prime alors sur le
      # `<server name="APP_ENV" value="test" force="true">` de backend/phpunit.dist.xml
      # (vérifié : Symfony Dotenv redonne la priorité à un getenv() réel lors du
      # bootEnv() de backend/tests/bootstrap.php) - `docker compose exec backend php
      # bin/phpunit` démarrait alors silencieusement en environnement "dev" au lieu de
      # "test" (service "test.service_container" introuvable). Ne pas la réintroduire ici
      # sans revoir ce commentaire.
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-factusentinel}:${POSTGRES_PASSWORD:-factusentinel}@postgres:5432/${POSTGRES_DB:-factusentinel}?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://redis:6379'
      # Traitement asynchrone (Phase 7, docs/06-technical-architecture.md section 13) :
      # Redis reste un backend de transport, jamais une source de vérité métier.
      MESSENGER_TRANSPORT_DSN: 'redis://redis:6379/messages'
      # Validator Container Mustang (ADR-008), réseau Docker interne uniquement.
      MUSTANG_BASE_URL: 'http://mustang:8080'
      # Chemin absolu du conteneur - backend/.env porte un chemin relatif utilisable pour un
      # usage direct de bin/console sur l'hôte, jamais le bon répertoire de travail ici.
      STORAGE_LOCAL_PATH: '/app/var/storage/documents'
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mustang:
        condition: service_started
    expose:
      - '9000'

  # Worker Messenger (docs/06-technical-architecture.md, section 30 : "Symfony (API + worker)").
  # Même image que "backend", commande différente - jamais un second point d'entrée HTTP.
  worker:
    build:
      context: ./backend
      target: dev
    entrypoint: ['docker-entrypoint-worker-dev.sh']
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    # --time-limit fait volontairement sortir ce process avec le code 0 après 1h (pratique
    # Symfony Messenger courante, évite l'accumulation de fuites mémoire d'un process PHP
    # long-lived) - sans cette politique de redémarrage, cette sortie volontaire deviendrait
    # une panne silencieuse et définitive du traitement asynchrone (constaté après
    # implémentation : le worker s'est arrêté sans qu'aucun message ne le relance). Aucun
    # autre service de ce fichier n'a de mécanisme d'auto-extinction comparable, cette
    # politique reste donc spécifique à "worker".
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-factusentinel}:${POSTGRES_PASSWORD:-factusentinel}@postgres:5432/${POSTGRES_DB:-factusentinel}?serverVersion=18&charset=utf8'
      REDIS_URL: 'redis://redis:6379'
      MESSENGER_TRANSPORT_DSN: 'redis://redis:6379/messages'
      MUSTANG_BASE_URL: 'http://mustang:8080'
      STORAGE_LOCAL_PATH: '/app/var/storage/documents'
      # Cache/logs isolés de "backend" (App\Kernel::getCacheDir()/getLogDir()) : ce worker
      # est un processus long-lived (messenger:consume) qui ne doit jamais dépendre du
      # cache Symfony régénéré par un cache:clear/redémarrage de "backend" sur le même
      # bind-mount source - voir le commentaire de ces méthodes pour l'incident constaté.
      APP_CACHE_DIR: '/app/var/worker-cache'
      APP_LOG_DIR: '/app/var/worker-log'
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mustang:
        condition: service_started

  # Validator Container (ADR-008) : isolé du runtime PHP, jamais intégré directement -
  # appelé par "backend"/"worker" uniquement via le réseau Docker interne (pas de "ports:").
  mustang:
    build:
      context: ./docker/mustang
    expose:
      - '8080'

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    expose:
      - '3000'

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factusentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factusentinel}
      POSTGRES_DB: ${POSTGRES_DB:-factusentinel}
      # Chemin de données explicite : indépendant du chemin par défaut, qui varie
      # selon la version majeure de l'image officielle postgres.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Port hôte configurable (POSTGRES_HOST_PORT) : évite un conflit si un PostgreSQL
      # local tourne déjà sur 5432 sur la machine du développeur.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-factusentinel} -d ${POSTGRES_DB:-factusentinel}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    ports:
      # Port hôte configurable (REDIS_HOST_PORT), pour la même raison que Postgres ci-dessus.
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - '8080:80'

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  frontend_next_cache:
