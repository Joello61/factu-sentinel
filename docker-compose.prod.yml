# Overlay de production - staging ET production l'utilisent identiquement, la séparation
# se fait uniquement via le fichier .env chargé (jamais via ce fichier), même principe que
# docker-compose.beta.yml. Jamais fusionné dans docker-compose.yml.
#
# Usage :
#   docker compose --env-file .env.staging    -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Modèle de déploiement (plan Phase 17) : les images sont construites et poussées vers
# GHCR par la CI (.github/workflows/deploy.yml), jamais reconstruites sur le serveur -
# "docker compose pull" avant tout "up -d" rend la clause "build" encore présente dans
# docker-compose.yml sans effet en pratique (compose ne reconstruit que si l'image
# référencée est absente localement).
#
# TLS/edge public : géré par Traefik (infrastructure de niveau serveur, hors de ce
# dépôt - voir le runbook Phase 17, section Nginx/Traefik). "nginx" ci-dessous n'est
# plus qu'un pont HTTP -> FastCGI interne, jamais exposé directement au réseau hôte -
# "ACME_EMAIL"/le service "certbot" n'existent donc plus ici (déplacés vers la stack
# Traefik partagée).
#
# Variables attendues - voir .env.prod.example (jamais commité en valeurs réelles) :
#   PUBLIC_DOMAIN      - nom de domaine public (ex. app.factusentinel.fr) - utilisé à la
#                        fois par Nginx (server_name) et par la règle Host() du label
#                        Traefik ci-dessous
#   BACKEND_IMAGE      - image GHCR taguée par SHA (ex. ghcr.io/.../backend:<sha>)
#   FRONTEND_IMAGE     - image GHCR taguée par SHA
#   MUSTANG_IMAGE      - image GHCR taguée par SHA
#   CORS_ALLOW_ORIGIN  - regex d'origine correspondant à PUBLIC_DOMAIN, jamais un wildcard
#   FRONTEND_URL       - https://PUBLIC_DOMAIN
#   HSTS_ENABLED       - "true" uniquement une fois le certificat réel actif (Bloc B) -
#                        DIFFERE tant que ce n'est pas confirmé (10-security-privacy.md §68)
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB - valeurs réelles, jamais celles de dev

# Rappels importants (vérifiés avec "docker compose config" au moment d'écrire ce fichier,
# jamais supposés) :
# - Le comportement de fusion par défaut de Compose pour les listes ("ports", "volumes")
#   est un AJOUT (fusion par clé unique), jamais un remplacement - une liste vide dans un
#   override ne retire donc rien du fichier de base.
# - "build" (docker-compose.yml, cibles "dev") reste sinon présent dans la config fusionnée
#   même quand "image" est défini ici - sans effet tant que l'image existe déjà localement
#   ("docker compose pull" avant tout "up -d"), mais explicitement supprimé ci-dessous
#   plutôt que de reposer sur cette seule discipline opérationnelle (Fail Secure).
# Chaque endroit ci-dessous qui doit réellement remplacer/supprimer (jamais ajouter à) une
# clé du fichier de base utilise explicitement les tags "!override"/"!reset" (Compose
# Specification, supportés depuis Compose v2.24/v2.24.4 - vérifié sur la version
# installée, v2.38.1, le 26/08/2026).

services:
  # "storage_documents" (volume nommé, persistant, déclaré en bas de ce fichier) remplace
  # le bind-mount de dev sur STORAGE_LOCAL_PATH (/app/var/storage/documents,
  # backend/.env) : sans lui, un document uploadé serait écrit dans la couche
  # inscriptible éphémère du conteneur et perdu au prochain déploiement (l'image est
  # retirée puis recréée à chaque "docker compose pull" + "up -d", jamais réutilisée en
  # place) - même volume partagé avec "worker" ci-dessous, qui lit les mêmes fichiers via
  # StorageInterface::retrieve() (App\Document\MessageHandler\ExtractDocumentContentHandler).
  backend:
    image: '${BACKEND_IMAGE}'
    build: !reset null
    volumes: !override
      - storage_documents:/app/var/storage/documents
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      CORS_ALLOW_ORIGIN: '${CORS_ALLOW_ORIGIN}'
      FRONTEND_URL: '${FRONTEND_URL}'
      HSTS_ENABLED: '${HSTS_ENABLED:-false}'
    restart: unless-stopped

  # "entrypoint" de base (docker-compose.yml) est spécifique au dev : entrypoint-worker-dev.sh
  # attend un bind-mount partagé avec "backend" qui n'existe pas ici (image déjà construite,
  # rien à attendre) - !override vide rend à l'entrypoint par défaut de l'image ("command"
  # ci-dessous, hérité du fichier de base, s'exécute alors directement).
  worker:
    image: '${BACKEND_IMAGE}'
    build: !reset null
    volumes: !override
      - storage_documents:/app/var/storage/documents
    entrypoint: !override []
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'

  mustang:
    image: '${MUSTANG_IMAGE}'
    build: !reset null
    restart: unless-stopped

  frontend:
    image: '${FRONTEND_IMAGE}'
    build: !reset null
    volumes: !override []
    environment:
      NODE_ENV: production
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    # Jamais publié sur l'hôte en production, contrairement au 127.0.0.1:5432 du dev -
    # l'accès (backup, debug) passe par "docker compose exec", jamais par le réseau hôte
    # (docs/10-security-privacy.md section 52).
    ports: !override []

  redis:
    restart: unless-stopped
    ports: !override []
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # N'est plus l'edge public depuis l'introduction de Traefik (plan Phase 17, section
  # Nginx/Traefik) : ne publie plus de port hôte, ne termine plus le TLS. Traefik route
  # vers ce service en HTTP interne sur le réseau externe partagé "traefik-public" -
  # Nginx reste uniquement le pont HTTP -> FastCGI vers "backend" (PHP-FPM), que Traefik
  # ne sait pas parler nativement.
  nginx:
    restart: unless-stopped
    volumes: !override
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
    # Le fichier de base (docker-compose.yml, dev/beta) publie "8080:80" sur l'hôte - une
    # liste vide en fusion par défaut n'aurait fait qu'AJOUTER à cette valeur (jamais la
    # retirer, cf. rappel en tête de ce fichier) : "!override" la remplace explicitement
    # par aucun port publié, Traefik étant seul point d'entrée réseau vers ce service
    # (Fail Secure) - constaté avec "docker compose config" avant correction.
    ports: !override []
    environment:
      PUBLIC_DOMAIN: '${PUBLIC_DOMAIN}'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - traefik-public
    # Les labels Traefik (nom du routeur) ne sont PAS ici : Compose interpole les
    # variables d'environnement dans les valeurs de labels, jamais dans leurs clés
    # (vérifié avec "docker compose config" le 26/08/2026) - or Traefik traite les noms
    # de routeurs comme des identifiants globaux sur tout le serveur, pas par projet ni
    # par environnement. Deux stacks (staging/production) sur le même VPS qui
    # déclareraient toutes les deux un routeur nommé "factusentinel" entreraient donc en
    # conflit. Les labels réels vivent dans docker-compose.prod.traefik.yml, propre à
    # chaque environnement (voir docker-compose.prod.traefik.yml.example), jamais dans ce
    # fichier générique partagé.

  # Monitoring auto-hébergé (Phase 17, docs/12-roadmap.md §41) - OVHcloud n'a pas
  # d'équivalent natif à Scaleway Cockpit (comparaison hébergeur, plan Phase 17). Interface
  # jamais exposée publiquement (accès par tunnel SSH uniquement, voir docker/monitoring/
  # README.md) : un tableau de bord de supervision révèle la topologie interne et n'a
  # d'utilité que pour l'opérateur, jamais pour un utilisateur final. Les moniteurs
  # eux-mêmes (HTTP, TCP, push) se configurent une fois via son interface, pas par ce
  # fichier - Uptime Kuma ne propose pas de provisioning déclaratif par YAML au moment de
  # l'écriture (vérifié le 26/08/2026).
  monitoring:
    image: louislam/uptime-kuma:2.3.2
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - '127.0.0.1:3001:3001'

volumes:
  storage_documents:
  uptime_kuma_data:

# Réseau partagé avec la stack Traefik (infrastructure de niveau serveur, hors de ce
# dépôt - voir le runbook Phase 17) - créé une seule fois sur le serveur
# ("docker network create traefik-public"), jamais par ce fichier lui-même.
networks:
  traefik-public:
    external: true
