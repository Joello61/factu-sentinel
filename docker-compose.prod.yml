# Overlay de production - staging ET production l'utilisent identiquement, la séparation
# se fait uniquement via le fichier .env chargé (jamais via ce fichier), même principe que
# docker-compose.beta.yml. Jamais fusionné dans docker-compose.yml.
#
# Usage :
#   docker compose --env-file .env.staging    -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Modèle de déploiement (plan Phase 17) : les images sont construites et poussées vers
# GHCR par la CI (.github/workflows/deploy.yml), jamais reconstruites sur le serveur -
# "docker compose pull" avant tout "up -d" rend la clause "build" encore présente dans
# docker-compose.yml sans effet en pratique (compose ne reconstruit que si l'image
# référencée est absente localement).
#
# TLS/edge public : géré par Traefik (infrastructure de niveau serveur, hors de ce
# dépôt - voir le runbook Phase 17, section Nginx/Traefik). "nginx" ci-dessous n'est
# plus qu'un pont HTTP -> FastCGI interne, jamais exposé directement au réseau hôte -
# "ACME_EMAIL"/le service "certbot" n'existent donc plus ici (déplacés vers la stack
# Traefik partagée).
#
# Variables attendues - voir .env.prod.example (jamais commité en valeurs réelles) :
#   PUBLIC_DOMAIN      - nom de domaine public (ex. app.factusentinel.fr) - utilisé à la
#                        fois par Nginx (server_name) et par la règle Host() du label
#                        Traefik ci-dessous
#   BACKEND_IMAGE      - image GHCR taguée par SHA (ex. ghcr.io/.../backend:<sha>)
#   FRONTEND_IMAGE     - image GHCR taguée par SHA
#   MUSTANG_IMAGE      - image GHCR taguée par SHA
#   CORS_ALLOW_ORIGIN  - regex d'origine correspondant à PUBLIC_DOMAIN, jamais un wildcard
#   FRONTEND_URL       - https://PUBLIC_DOMAIN
#   HSTS_ENABLED       - "true" uniquement une fois le certificat réel actif (Bloc B) -
#                        DIFFERE tant que ce n'est pas confirmé (10-security-privacy.md §68)
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB - valeurs réelles, jamais celles de dev

# Rappels importants (vérifiés avec "docker compose config" au moment d'écrire ce fichier,
# jamais supposés) :
# - Le comportement de fusion par défaut de Compose pour les listes ("ports", "volumes")
#   est un AJOUT (fusion par clé unique), jamais un remplacement - une liste vide dans un
#   override ne retire donc rien du fichier de base.
# - "build" (docker-compose.yml, cibles "dev") reste sinon présent dans la config fusionnée
#   même quand "image" est défini ici - sans effet tant que l'image existe déjà localement
#   ("docker compose pull" avant tout "up -d"), mais explicitement supprimé ci-dessous
#   plutôt que de reposer sur cette seule discipline opérationnelle (Fail Secure).
# Chaque endroit ci-dessous qui doit réellement remplacer/supprimer (jamais ajouter à) une
# clé du fichier de base utilise explicitement les tags "!override"/"!reset" (Compose
# Specification, supportés depuis Compose v2.24/v2.24.4 - vérifié sur la version
# installée, v2.38.1, le 26/08/2026).

services:
  # "storage_documents" (volume nommé, persistant, déclaré en bas de ce fichier) remplace
  # le bind-mount de dev sur STORAGE_LOCAL_PATH (/app/var/storage/documents,
  # backend/.env) : sans lui, un document uploadé serait écrit dans la couche
  # inscriptible éphémère du conteneur et perdu au prochain déploiement (l'image est
  # retirée puis recréée à chaque "docker compose pull" + "up -d", jamais réutilisée en
  # place) - même volume partagé avec "worker" ci-dessous, qui lit les mêmes fichiers via
  # StorageInterface::retrieve() (App\Document\MessageHandler\ExtractDocumentContentHandler).
  backend:
    image: '${BACKEND_IMAGE}'
    build: !reset null
    # "missing" (le défaut de Compose) réutiliserait silencieusement une image locale déjà
    # taguée BACKEND_IMAGE/FRONTEND_IMAGE/MUSTANG_IMAGE si l'appelant a oublié d'exporter le
    # vrai SHA avant "up -d" - incident réel constaté en production (Phase 18, 27/08/2026,
    # voir .env.prod.example) : retombé sur le placeholder littéral REMPLACER_PAR_LE_SHA,
    # qui correspondait par hasard à une vieille image en cache local, sans la moindre
    # erreur visible. "always" transforme ce même oubli en échec bruyant (image introuvable
    # sur le registre) au lieu d'un déploiement silencieusement obsolète - même règle
    # appliquée à "worker"/"mustang"/"frontend" ci-dessous, qui partagent ces variables.
    pull_policy: always
    volumes: !override
      - storage_documents:/app/var/storage/documents
      - jwt_keys:/app/config/jwt
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      CORS_ALLOW_ORIGIN: '${CORS_ALLOW_ORIGIN}'
      FRONTEND_URL: '${FRONTEND_URL}'
      HSTS_ENABLED: '${HSTS_ENABLED:-false}'
      # backend/.env (committé) ne définit que le défaut de dev "null://null" - sans cette
      # ligne, ce défaut resterait actif en production (aucun autre fichier ne le
      # surcharge) et VerifyEmailMailer/PasswordResetMailer/InvitationMailer jetteraient
      # silencieusement chaque email (Phase 18, 27/08/2026). Jamais nécessaire sur
      # "worker" : ces trois mailers ne sont appelés que depuis des controllers
      # synchrones de "backend".
      MAILER_DSN: '${MAILER_DSN}'
      # backend/.env (committé) définit "no-reply@factusentinel.local" (domaine fictif,
      # jamais valide) - sans surcharge ici, Brevo rejette l'envoi (expéditeur non
      # authentifié, incident réel constaté en production, Phase 18, 27/08/2026). Même
      # périmètre que MAILER_DSN ci-dessus (backend uniquement).
      MAILER_FROM: '${MAILER_FROM}'
      # backend/.env (committé) laisse MISTRAL_API_KEY vide par convention (secret jamais en
      # dur dans un fichier versionné) - sans surcharge ici, l'AI Gateway échoue
      # systématiquement (App\AI\Exception\AiProviderUnavailableException, repli contrôlé
      # vers "L'assistant IA n'est pas disponible pour le moment.", jamais un crash - mais
      # jamais de vraie réponse IA non plus). MISTRAL_BASE_URL/MISTRAL_MODEL restent les
      # défauts de backend/.env, corrects pour tout environnement. Backend uniquement, même
      # raison que MAILER_DSN - les deux endpoints IA sont synchrones (08-api-specification.md
      # section 35), jamais appelés depuis "worker".
      MISTRAL_API_KEY: '${MISTRAL_API_KEY}'
      # backend/.env (committé) définit APP_SECRET="" (placeholder vide, jamais une valeur
      # utilisable) - sans surcharge ici, framework.secret ("kernel.secret") reste vide en
      # production. symfonycasts/verify-email-bundle en dépend (UriSigner interne) pour
      # signer le lien de vérification d'email : incident réel constaté en production
      # (Phase 18, 27/08/2026) - "POST /auth/register" échouait en 500
      # ("InvalidArgumentException: A non-empty secret is required.",
      # UriSigner.php:42), avant même que le mailer n'intervienne. Nécessaire aussi sur
      # "worker" - kernel.secret est une primitive du framework, pas une dépendance
      # propre à un seul controller comme MAILER_DSN ci-dessus.
      APP_SECRET: '${APP_SECRET}'
      # backend/.env (committé) commite de vraies valeurs hexadécimales, mais de
      # développement local uniquement (jamais destinées à un environnement réel,
      # `docs/15-internal-security-review.md` section 3) - sans surcharge ici, la paire de
      # clés JWT générée au démarrage (docker/entrypoint-prod.sh) serait chiffrée avec une
      # passphrase de dev, jamais isolée par environnement. Jamais nécessaire sur "worker" :
      # lui seul ne génère jamais les clés (voir son commentaire ci-dessous, "worker" ne
      # gère aucune route HTTP/JWT et ne doit jamais écrire concurremment sur "jwt_keys").
      JWT_PASSPHRASE: '${JWT_PASSPHRASE}'
      PLATFORM_ADMIN_JWT_PASSPHRASE: '${PLATFORM_ADMIN_JWT_PASSPHRASE}'
      # backend/.env (committé) définit une vraie valeur hexadécimale, mais de
      # développement local uniquement (même défaut que JWT_PASSPHRASE ci-dessus) - jamais
      # câblé ici depuis la Phase 18 (oubli réel, jamais une décision délibérée), constaté
      # le 28/08/2026 en vérifiant le scrape Prometheus depuis le nouveau socle partagé
      # (Phase 19) : la production acceptait silencieusement le jeton de développement,
      # public dans le dépôt, au lieu de la vraie valeur de `.env.production`
      # (`GetMetricsController` compare via `hash_equals`, jamais un 500 qui aurait signalé
      # le problème plus tôt - juste une acceptation incorrecte). Jamais nécessaire sur
      # "worker" - `GET /api/metrics` n'est jamais exposé que par "backend".
      METRICS_SCRAPE_TOKEN: '${METRICS_SCRAPE_TOKEN}'
    restart: unless-stopped
    # "observability-shared" (export OTLP vers "tempo:4318") n'est PAS ici - vit dans
    # docker-compose.prod.observability.yml, chargé uniquement en production
    # (ssh-deploy.sh) - voir ce fichier pour le raisonnement complet (bug réel corrigé,
    # Phase 19, 28/08/2026).

  # "entrypoint" de base (docker-compose.yml) est spécifique au dev : entrypoint-worker-dev.sh
  # attend un bind-mount partagé avec "backend" qui n'existe pas ici (image déjà construite,
  # rien à attendre). "!override []" désactive entièrement l'ENTRYPOINT de l'image, y
  # compris celui du Dockerfile ("docker-entrypoint-prod.sh", génération des clés JWT) -
  # vérifié sur la documentation officielle Docker Compose ("entrypoint: []" équivaut à
  # "docker run --entrypoint ''", jamais un simple retour à l'image par défaut). C'est
  # volontaire ici : "worker" ne gère aucune route HTTP/JWT (même principe déjà établi par
  # docker/entrypoint-worker-dev.sh : "il ne refait jamais lui-même... génération de clés
  # JWT, dont il n'a de toute façon pas besoin") et ne doit JAMAIS générer les clés en
  # parallèle de "backend" sur le même volume "jwt_keys" - les deux entrypoints démarrant en
  # même temps ("docker compose up -d"), deux écritures concurrentes de la clé privée la
  # corrompent (incident réel constaté en production, Phase 18, 27/08/2026 :
  # "InvalidKeyProvided: bad decrypt", login fonctionnel juste après un déploiement puis en
  # échec intermittent). "command" (fichier de base) s'exécute donc directement comme
  # PID 1, sans script intermédiaire - jamais un problème ici, contrairement à "backend" qui
  # a réellement besoin de la génération JWT avant "php-fpm".
  worker:
    image: '${BACKEND_IMAGE}'
    build: !reset null
    pull_policy: always
    volumes: !override
      - storage_documents:/app/var/storage/documents
    entrypoint: !override []
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      # Même raison que "backend" ci-dessus (kernel.secret) - jamais MAILER_DSN ici, voir
      # le commentaire correspondant sur "backend".
      APP_SECRET: '${APP_SECRET}'
    # "observability-shared" n'est PAS ici, voir le commentaire correspondant sur "backend".

  mustang:
    image: '${MUSTANG_IMAGE}'
    build: !reset null
    pull_policy: always
    restart: unless-stopped

  frontend:
    image: '${FRONTEND_IMAGE}'
    build: !reset null
    pull_policy: always
    volumes: !override []
    environment:
      NODE_ENV: production
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    # Jamais publié sur l'hôte en production, contrairement au 127.0.0.1:5432 du dev -
    # l'accès (backup, debug) passe par "docker compose exec", jamais par le réseau hôte
    # (docs/10-security-privacy.md section 52).
    ports: !override []

  redis:
    restart: unless-stopped
    ports: !override []
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # N'est plus l'edge public depuis l'introduction de Traefik (plan Phase 17, section
  # Nginx/Traefik) : ne publie plus de port hôte, ne termine plus le TLS. Traefik route
  # vers ce service en HTTP interne sur le réseau externe partagé "traefik-public" -
  # Nginx reste uniquement le pont HTTP -> FastCGI vers "backend" (PHP-FPM), que Traefik
  # ne sait pas parler nativement.
  nginx:
    restart: unless-stopped
    volumes: !override
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
    # Le fichier de base (docker-compose.yml, dev/beta) publie "8080:80" sur l'hôte - une
    # liste vide en fusion par défaut n'aurait fait qu'AJOUTER à cette valeur (jamais la
    # retirer, cf. rappel en tête de ce fichier) : "!override" la remplace explicitement
    # par aucun port publié, Traefik étant seul point d'entrée réseau vers ce service
    # (Fail Secure) - constaté avec "docker compose config" avant correction.
    ports: !override []
    environment:
      PUBLIC_DOMAIN: '${PUBLIC_DOMAIN}'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - traefik-public
    # "observability-shared" n'est PAS ici (cible de scrape Prometheus) - vit dans
    # docker-compose.prod.observability.yml, chargé uniquement en production
    # (ssh-deploy.sh), voir ce fichier pour le raisonnement complet.
    #
    # Les labels Traefik (nom du routeur) ne sont PAS ici : Compose interpole les
    # variables d'environnement dans les valeurs de labels, jamais dans leurs clés
    # (vérifié avec "docker compose config" le 26/08/2026) - or Traefik traite les noms
    # de routeurs comme des identifiants globaux sur tout le serveur, pas par projet ni
    # par environnement. Deux stacks (staging/production) sur le même VPS qui
    # déclareraient toutes les deux un routeur nommé "factusentinel" entreraient donc en
    # conflit. Les labels réels vivent dans docker-compose.prod.traefik.yml, propre à
    # chaque environnement (voir docker-compose.prod.traefik.yml.example), jamais dans ce
    # fichier générique partagé.

  # Le monitoring (Uptime Kuma) et l'observabilité (Loki/Alloy/Prometheus/Tempo/Grafana)
  # vivaient auparavant ici, couplés à ce seul projet Compose (Phase 17 §41, Phase 18) -
  # migrés vers le socle partagé du VPS (Phase 19,
  # docs/20-observability-infrastructure-migration.md) : dépôt privé
  # github.com/Joello61/infrastructure, réutilisable par de futurs projets hébergés sur ce
  # même serveur. "nginx"/"backend"/"worker" rejoignent "observability-shared" pour être
  # scrapés/tracés - voir docker-compose.prod.observability.yml, chargé uniquement en
  # production (portée déjà décidée, jamais staging).

volumes:
  storage_documents:
  # config/jwt/*.pem (les deux trousseaux, tenant et platform_admin) - généré au démarrage
  # par docker/entrypoint-prod.sh, jamais bakée dans l'image (backend/Dockerfile) ; ce
  # volume nommé est ce qui permet à "--skip-if-exists" de réutiliser la même paire d'un
  # déploiement à l'autre plutôt que d'en régénérer une à chaque redémarrage de conteneur.
  # Monté uniquement sur "backend", jamais "worker" (voir son commentaire) - un seul
  # écrivain, jamais deux entrypoints concurrents sur le même fichier.
  jwt_keys:

# "traefik-public" est un réseau partagé avec le socle d'infrastructure du VPS
# (github.com/Joello61/infrastructure, Phase 19 - hors de ce dépôt) - créé une seule fois
# sur le serveur ("docker network create traefik-public"), jamais par ce fichier
# lui-même. "observability-shared" n'est PAS déclaré ici (jamais staging) - voir
# docker-compose.prod.observability.yml.
networks:
  traefik-public:
    external: true
